[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-grounded-agent"
version = "0.1.0"
description = "Auditable billing-policy workflow and cross-provider CLI evaluation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "openai>=2,<3", "anthropic>=0.75,<1", "python-dotenv>=1,<2"]

[project.scripts]
prototype = "policy_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/policy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
